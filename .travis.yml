language: python
python:
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"
dist: jammy
addons:
  apt:
    packages:
    - cmake
# command to install dependencies
cache:
  - pip
install:
  - make requirements
  - python setup.py install

script:
  - make flake
  - make black-check
  - make test-docs
  - make test-handler
  - make test-middleware
  - make test-placebo
  - make test-async
  - make test-general

after_success:
  coveralls
notifications:
  slack: zappateam:TTJ0mfHunDK0IBweKkEXjGpR
